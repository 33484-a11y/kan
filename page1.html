<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการอาหาร</title>
</head>
<body>
    <center>
    <h1 style="color:brown(185, 24, 191, 0.647);">สตรีศรีน่านโภชนาการ</h1>
    </center>
    <h2>เมนูผัด</h2>
    <ol type="1">
        <li>ผัดกระเพรา</li>
        <li>ผัดผักบุุ้ง</li>
        <li>ผัดเห็ดรวม</li>
    </ol>
    <h2>เมนูของหวาน</h2>
    <ul type="square">
        <li>บัวลอยใข่หวาน</li>
        <li>น้ำแข็งใส</li>
        <li>ลอดช่อง</li>
    </ul>
    <h2>เมนูเครื่องดื่ม</h2>
    <ul type="a">
        <li>ชานม</li>
        <li>นมเย็น</li>
        <li>นมสด</li>
    </ul>
    <h2>เมนูทอด</h2>
    <ol type="A">
        <li>ไก่ทอด</li>
        <li>หมูทอด</li>
        <li>ปลาทอด</li>
    </ol>
</body>
</html>
